name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel previous runs on the same branch when a new commit arrives.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-extras --dev
      - name: Ruff (format + check)
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - name: mypy
        run: uv run mypy src/ --ignore-missing-imports --warn-unused-ignores

  tests:
    # One job per test category: they run in parallel and a red check names
    # the category that broke.
    name: tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - agents
          - decision
          - environment
          - metrics
          - plots
          - response_protocol
          - scoring
          - utils
          - voting
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-extras --dev
      - name: pytest
        env:
          COVERAGE_FILE: .coverage.${{ matrix.suite }}
        run: uv run pytest tests/test_eci_${{ matrix.suite }}*.py
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.suite }}
          path: .coverage.${{ matrix.suite }}
          include-hidden-files: true

  coverage:
    name: Coverage report
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-extras --dev
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combine
        run: |
          uv run coverage combine
          uv run coverage html
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
      - name: Summary
        run: |
          echo "## 📊 Coverage Report" >> $GITHUB_STEP_SUMMARY
          uv run coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

  notebooks:
    name: Notebooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-extras --dev
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz
      # Per-cell timeout bumped to 600 s so the heavier notebooks have room.
      - name: Execute notebooks
        run: |
          uv run python -m nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=600 \
            notebooks/*.ipynb
